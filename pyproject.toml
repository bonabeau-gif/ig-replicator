[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igr-invariance"
version = "1.0.0"
description = "Information-geometric replicator dynamics, invariance defect, and fitness shaping: reproducibility package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eric Bonabeau" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/bonabeau-gif/ig-replicator"

[tool.setuptools]
packages = ["igr"]
